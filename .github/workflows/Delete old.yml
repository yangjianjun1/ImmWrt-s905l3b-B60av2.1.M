# ==============================================================================
# Delete keep last 5 runs - 只保留每个 workflow 最近 5 条，其余全部删除
# ==============================================================================
#
# 用途：
#   大扫除模式。不限成功/失败、不限天数，每个 workflow 只保留最近 5 条运行记录，
#   超出的历史记录（含成功固件记录）一律删除。
#
# 触发方式：
#   仅手动触发：Actions 页面 → 选择此 workflow → "Run workflow"
#   无定时、无 push 自动触发
#
# 与 delete-old-runs.yml 的区别：
#   delete-old-runs.yml：只清理失败/取消/跳过记录，成功固件保留，按天数+条数双过滤
#   本文件：只按条数保留最近 5 条，成功失败都删（被保留的最近 5 条除外）
#
# 重要提醒：
#   - 删除不可逆，Artifact 固件会随记录一起消失，重要固件先下载
#   - 首次执行保持 dry_run=true 预览，确认待删列表无误再改 false
#   - keep_minimum_runs 是“每个 workflow 保留条数”，不是全仓库合计
#
# ==============================================================================

name: Delete keep last 5 runs 只留最近5条

on:
  # 仅手动触发（无定时、无 push）
  workflow_dispatch:
    inputs:
      keep_last:
        description: '每个 workflow 保留最近几条（默认 5）'
        required: true
        default: '5'
      retain_days:
        description: '天数阈值（默认 36500，基本不限天数，只按条数保留）'
        required: false
        default: '36500'
      delete_workflow_pattern:
        description: '按名称过滤：留空=全部 workflow；多个用 | 分隔，括号需转义'
        required: false
        default: ''
      dry_run:
        description: '预览模式：true=只打印不删除；false=实际执行删除'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

# 权限说明：
#   actions: write  → 删除 workflow runs 必需
#   contents: read  → 读取仓库信息
permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs, keep last N
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}

          # 保留天数：设很大，实际只靠下面的条数限制
          retain_days: ${{ github.event.inputs.retain_days || 36500 }}

          # 每个 workflow 至少保留最近 N 条（默认 5）
          keep_minimum_runs: ${{ github.event.inputs.keep_last || 5 }}

          # 非每日保留模式
          use_daily_retention: 'false'

          # 留空=匹配全部 workflow；可填正则，如 Build M302A \(S905L3B\)
          delete_workflow_pattern: ${{ github.event.inputs.delete_workflow_pattern }}

          # 全部状态的 workflow 都纳入
          delete_workflow_by_state_pattern: 'ALL'

          # 全部结论都删（成功 success、失败 failure、取消 cancelled、跳过 skipped 等）
          delete_run_by_conclusion_pattern: 'ALL'

          # 跳过仍有关联分支/PR 的运行
          check_branch_existence: false
          check_pullrequest_exist: false

          # 预览模式
          dry_run: ${{ github.event.inputs.dry_run || 'true' }}
