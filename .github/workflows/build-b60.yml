name: Build B60 (S905L3B)

on:
  workflow_dispatch:
    inputs:
      src_branch:
        description: 'ImmortalWrt 源码分支'
        required: false
        default: 'openwrt-24.10'
      release:
        description: '构建后发布到 Releases'
        required: false
        default: 'false'

concurrency:
  group: build-b60-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            libncurses5-dev libssl-dev libelf-dev autoconf automake libtool shtool \
            texinfo zlib1g-dev gettext wget unzip rsync \
            python3 python3-setuptools python3-pip python3-venv python3-yaml python3-jinja2 \
            file patch bc parted dosfstools btrfs-progs \
            u-boot-tools xz-utils pigz
          sudo apt-get clean

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --branch ${{ github.event.inputs.src_branch }} \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject B60 target files
        run: |
          rm -rf openwrt/target/linux/meson
          cp -r target/linux/meson openwrt/target/linux/meson

          mkdir -p openwrt/board/b60av21m
          cp -r board/b60av21m/* openwrt/board/b60av21m/ 2>/dev/null || true

          echo "=== Injected files ==="
          ls -R target/linux/meson/image/ 2>/dev/null || echo "WARNING: image/ directory missing!"
          ls target/linux/meson/files-6.12/arch/arm64/boot/dts/amlogic/ 2>/dev/null || echo "WARNING: DTS missing!"

      - name: Prepare config
        run: |
          cd openwrt

          # 1. 清空旧配置
          rm -f .config

          # 2. 定位 B60 配置文件
          if [ -f ../configs/b60av21m.config ]; then
            echo "Using configs/b60av21m.config"
            B60_CONFIG=../configs/b60av21m.config
          elif [ -f ../b60av21m.config ]; then
            echo "Using b60av21m.config (root)"
            B60_CONFIG=../b60av21m.config
          else
            echo "ERROR: No B60 config found!"
            echo "Expected: configs/b60av21m.config or b60av21m.config"
            exit 1
          fi

          # 3
