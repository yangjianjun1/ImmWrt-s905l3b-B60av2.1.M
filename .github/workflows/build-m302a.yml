# ============================================================================
# 仓库：M302A / S905L3B OpenWrt 固件编译
# 两段式流程：
#   1) 用标准 buildroot 编译通用 armsr/armv8 rootfs.tar.gz（不含板级适配）
#   2) 调用 ophub 打包 action，按 board=s905l3b 注入第三方内核/u-boot/dtb，生成 img 固件
# 设备参数（来自 ophub model_database.conf）：
#   SoC: s905l3b | BOARD: s905l3b | dtb: meson-gxl-s905l3b-m302a.dtb
#   u-boot: u-boot-s905x-s912.bin | 内核: stable 6.18.y | family: meson-gxl
# ============================================================================

name: Build M302A (S905L3B) OpenWrt

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "打包板子 BOARD（M302A 用 s905l3b）"
        required: false
        default: "s905l3b"
        type: string
      openwrt_kernel:
        description: "内核系列版本（留空用 action 默认）"
        required: false
        default: "6.18.y"
        type: string
      openwrt_ip:
        description: "默认管理 IP（留空用 192.168.1.1）"
        required: false
        default: "192.168.1.1"
        type: string
      openwrt_size:
        description: "ROOTFS 分区大小 MiB（需 >2048）"
        required: false
        default: "2560"
        type: string
      builder_name:
        description: "固件构建者签名（不要带空格）"
        required: false
        default: "m302a"
        type: string

env:
  TZ: Asia/Shanghai
  # rootfs 源码仓库与分支（标准 buildroot 编 armsr 通用根文件系统）
  # SOURCE_REPO: https://github.com/openwrt/openwrt.git
  # SOURCE_BRANCH: main
  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
  SOURCE_BRANCH: openwrt-24.10
  # 第三方内核仓库与标签
  KERNEL_REPO: ophub/kernel
  KERNEL_USAGE: stable

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo swapoff -a || true
          sudo apt-get -y update
          sudo apt-get -y install build-essential libncurses-dev gawk flex bison git gettext \
            libssl-dev python3 python3-pip unzip ccache rsync device-tree-compiler zlib1g-dev \
            libelf-dev quilt subversion file
          # 官方一键依赖清单（失败不中断，上面已装基础包）
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends) || true
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "${TZ}"
          date -u

      # Actions 免费磁盘偏小，官方做法：挂载一块虚拟扩展盘到 /builder
      - name: Create virtual disk for extended storage
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: 磁盘空间不足: ${root_avail}G"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th

      - name: Clone OpenWrt source
        working-directory: /builder
        run: |
          git clone -q --single-branch --depth=1 --branch=${{ env.SOURCE_BRANCH }} \
            ${{ env.SOURCE_REPO }} openwrt
          ln -sf /builder/openwrt ${{ github.workspace }}/openwrt

      - name: Load custom feeds (diy-part1)
        run: |
          chmod +x config/diy-part1.sh
          ./config/diy-part1.sh

      - name: Update feeds
        run: cd openwrt/ && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt/ && ./scripts/feeds install -a

      - name: Load custom config (diy-part2)
        run: |
          cp -f config/config openwrt/.config
          chmod +x config/diy-part2.sh
          cd openwrt/
          ${{ github.workspace }}/config/diy-part2.sh "${{ inputs.openwrt_ip }}" "true"

      - name: Download packages
        run: |
          cd openwrt/
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /builder/openwrt/.ccache
          key: openwrt-armsr-${{ github.sha }}
          restore-keys: |
            openwrt-armsr-

      - name: Compile rootfs
        run: |
          cd openwrt/
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(($(nproc) + 1)) V=s || make -j1 || make -j1 V=s
          ccache -s 2>/dev/null || true

      - name: Collect rootfs tar.gz
        run: |
          cd openwrt/
          mkdir -p output
          ls -alh bin/targets/*/*/* || true
          cp -f bin/targets/*/*/*-generic-rootfs.tar.gz output/
          cp -f .config output/config
          ls -lh output/

      - name: Upload rootfs tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: armsr-rootfs
          path: openwrt/output/*rootfs.tar.gz

      # 调用官方打包 action：注入第三方内核 / u-boot / dtb，生成 amlogic img
      - name: Package OpenWrt for M302A
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/output/*rootfs.tar.gz
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: true
          kernel_repo: ${{ env.KERNEL_REPO }}
          kernel_usage: ${{ env.KERNEL_USAGE }}
          openwrt_size: ${{ inputs.openwrt_size }}
          builder_name: ${{ inputs.builder_name }}
          openwrt_ip: ${{ inputs.openwrt_ip }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show packaged firmware
        run: |
          echo "PACKAGED_OUTPUTPATH=${{ env.PACKAGED_OUTPUTPATH }}"
          find out -maxdepth 2 -type f 2>/dev/null || true

      - name: Upload M302A firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: M302A-S905L3B-Firmware
          path: out/*.img.gz
