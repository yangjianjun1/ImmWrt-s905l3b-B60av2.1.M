name: 编译 ImmortalWrt - B60 (S905L3B)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  CONFIG_FILE: B60av2.1.M.config
  # DIY_P1_SH: op1.sh    # 玩客云残留，已禁用
  # DIY_P2_SH: op2.sh
  # DIY_P3_SH: op3.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

    - name: 检出代码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆 ImmortalWrt 源码
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 载入平台文件 (amlogic/meson)
      run: |
        echo "📁 检查 B60 平台目录结构..."

        # 无条件创建 openwrt 侧的 amlogic 目录
        mkdir -p openwrt/target/linux/amlogic

        # 拷贝 amlogic BOARD Makefile
        if [ -f "target/linux/amlogic/Makefile" ]; then
          cp target/linux/amlogic/Makefile openwrt/target/linux/amlogic/Makefile
          echo "✅ 已拷贝 amlogic/Makefile"
        else
          echo "❌ 仓库中缺少 target/linux/amlogic/Makefile"
          exit 1
        fi

        # 拷贝 meson 子目标
        if [ ! -d "target/linux/amlogic/meson" ]; then
          echo "❌ 仓库中缺少 target/linux/amlogic/meson 目录"
          exit 1
        fi

        cp -rf target/linux/amlogic/meson openwrt/target/linux/amlogic/meson
        echo "✅ 已拷贝 meson 子目标"

        # 验证关键文件
        for f in Makefile config-6.12; do
          if [ ! -e "openwrt/target/linux/amlogic/meson/$f" ]; then
            echo "❌ 缺少 amlogic/meson/$f"
            ls openwrt/target/linux/amlogic/meson/ || true
            exit 1
          fi
        done

        # 验证 DTS 文件
        DTS_PATH="openwrt/target/linux/amlogic/meson/files-6.12/arch/arm64/boot/dts/amlogic"
        if [ ! -d "$DTS_PATH" ] || [ -z "$(ls $DTS_PATH/*.dts 2>/dev/null)" ]; then
          echo "❌ 缺少 DTS 文件，期望路径: $DTS_PATH"
          ls -R openwrt/target/linux/amlogic/meson/files-6.12/ 2>/dev/null || true
          exit 1
        fi

        echo "✅ 平台文件验证通过"
        echo "📋 DTS 文件列表:"
        ls $DTS_PATH/*.dts
        echo "📋 meson 目录内容:"
        ls openwrt/target/linux/amlogic/meson/

    - name: 加载 B60 配置文件
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "❌ 仓库根目录缺少 $CONFIG_FILE"
          echo "当前文件列表:"
          ls -la
          exit 1
        fi
        cp $CONFIG_FILE openwrt/.config
        echo "✅ 已载入 $CONFIG_FILE"
        cd openwrt
        make defconfig

    - name: 下载包源码
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        cd openwrt
        echo "开始编译，使用 $(nproc) 线程..."
        make -j$(nproc) V=s
        echo "✅ 编译完成"

    - name: 整理产物
      run: |
        cd openwrt
        mkdir -p ../artifacts
        cp -r bin/targets/amlogic/meson/* ../artifacts/ 2>/dev/null || true
        echo "📦 产物列表:"
        ls -lh ../artifacts/ || echo "未找到产物"

    - name: 发布 Release
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: B60-${{ github.run_number }}
        files: artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
