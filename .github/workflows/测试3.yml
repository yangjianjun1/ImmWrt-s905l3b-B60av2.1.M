name: Build B60av21m USB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev zlib1g-dev \
            gawk git gettext libssl-dev xsltproc wget unzip python3 \
            dosfstools e2fsprogs fdisk parted

      - name: 准备源码
        run: bash op1.sh

      - name: 编译
        run: bash op2.sh

      - name: 打包 U 盘镜像
        run: bash pack-usb.sh

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: ImmWrt-B60av21m-usb
          path: output/*.img
